name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies
        run: npm install --prefix client

      - name: Run tests
        run: npm test --prefix client

      - name: Build client
        run: npm run build --prefix client

      # Optional: Deploy to Netlify using Netlify CLI (requires NETLIFY_AUTH_TOKEN secret)
      # - name: Deploy to Netlify
      #   run: npx netlify-cli deploy --dir=client/build --prod
      #   env:
      #     NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
